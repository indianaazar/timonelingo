    // --- EFECTOS SONOROS MEDIANTE WEB AUDIO API ---
    const Sound = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      },
      playSuccess() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const now = this.ctx.currentTime;
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc1.frequency.setValueAtTime(523.25, now);
        osc1.frequency.setValueAtTime(659.25, now + 0.09);
        osc2.frequency.setValueAtTime(783.99, now + 0.18);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(this.ctx.destination);

        osc1.start(now);
        osc2.start(now + 0.18);
        osc1.stop(now + 0.45);
        osc2.stop(now + 0.45);
      },
      playError() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.25);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.35);
      }
    };

      { f: "Luces de Navegación RIPA", b: "Tope: Blanca proel 225°.\nCostados: Verde (estribor) y Roja (babor) 112,5° c/u.\nAlcance: Blanca popel 135°.\nSin gobierno: 2 luces ROJAS todo horizonte en vertical." },
      { f: "Prioridades y Boyas IALA B", b: "Vela vs Vela:\n- Amuras contrarias: Babor cede a Estribor.\n- Misma amura: Barlovento cede a Sotavento.\nBoyas IALA B: Regla SIR (Saliendo, Izquierda Roja). Entrando: Babor = Verde, Estribor = Roja." }
    ];

    // --- ESTADO Y CONTROLADOR DE LA APLICACIÓN ---
    const app = {
      tab: 'map',
      streak: 5,
      points: 650,
      lives: 5,

      completedSubunits: {},
      currentSubunit: null,
      quizQuestions: [],
      qIndex: 0,
      selectedOption: null,
      isAnswered: false,

      figureIndex: 0,
      exploreMode: false,
      solvedParts: {},
      exploredPart: null,
      tactileTarget: null,
      tactileSuccess: null,
      tactileClicked: null,

      cardIndex: 0,
      isFlipped: false,

      examQuestions: [],
      examIndex: 0,
      examScore: 0,

      init() {
        try {
          this.completedSubunits = JSON.parse(localStorage.getItem('timonel_completed') || '{}');
          this.solvedParts = JSON.parse(localStorage.getItem('timonel_solved_figures') || '{}');
        } catch(e) {
          this.completedSubunits = {};
          this.solvedParts = {};
        }
        this.nextTactile();
        this.render();
      },

      setTab(tabName) {
        this.tab = tabName;
        if (tabName === 'tactile' && !this.tactileTarget) this.nextTactile();
        if (tabName === 'exam') this.startExam();
        this.render();
      },

      updateStats() {
        document.getElementById('statStreak').innerText = this.streak;
        document.getElementById('statPoints').innerText = this.points;
        document.getElementById('statLives').innerText = this.lives;
      },

      render() {
        ['map', 'tactile', 'flashcards', 'exam'].forEach(t => {
          const btn = document.getElementById(`nav-${t}`);
          if (btn) {
            if (this.tab === t) {
              btn.className = "flex flex-col items-center gap-1 text-sky-600 font-extrabold text-[11px] p-1 scale-105 transition-transform";
            } else {
              btn.className = "flex flex-col items-center gap-1 text-slate-400 font-extrabold text-[11px] p-1";
            }
          }
        });

        const main = document.getElementById('appContainer');
        main.innerHTML = '';

        if (this.tab === 'map') this.renderMap(main);
        else if (this.tab === 'quiz') this.renderQuiz(main);
        else if (this.tab === 'tactile') this.renderTactile(main);
        else if (this.tab === 'flashcards') this.renderFlashcards(main);
        else if (this.tab === 'exam') this.renderExam(main);

        this.updateStats();
      },

      renderMap(container) {
        const completedCount = Object.keys(this.completedSubunits).length;
        const totalSubunits = 12;
        const progressPct = Math.round((completedCount / totalSubunits) * 100);

        let html = `
          <div class="space-y-4 pb-12">
            <div class="bg-gradient-to-r from-sky-700 to-cyan-600 rounded-3xl p-4 text-white shadow-lg flex items-center justify-between">
              <div>
                <span class="text-[10px] font-black uppercase tracking-wider bg-white/20 px-2.5 py-0.5 rounded-full">Ruta Progresiva YCN • 2026</span>
                <h2 class="text-xl font-black mt-1">Curso de Timonel</h2>
                <p class="text-xs text-sky-100 font-semibold">${completedCount} de ${totalSubunits} Subunidades (${progressPct}%)</p>
                <div class="w-40 bg-black/20 h-2 rounded-full mt-2 overflow-hidden border border-white/20">
                  <div class="bg-amber-400 h-full rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
                </div>
              </div>
              <div class="text-4xl">⛵</div>
            </div>

            <div class="space-y-4 pt-1">
        `;

        UNITS.forEach(u => {
          const unitCompleted = u.subunits.filter(s => this.completedSubunits[s.id]).length;
          html += `
            <div class="bg-white border-2 border-slate-200 rounded-3xl p-4 shadow-sm space-y-3">
              <div class="flex items-center gap-3 border-b border-slate-100 pb-2.5">
                <div class="w-10 h-10 rounded-2xl ${u.color} text-white flex items-center justify-center text-xl font-black shadow-sm">
                  ${u.icon}
                </div>
                <div class="flex-1">
                  <div class="flex items-center justify-between">
                    <span class="text-[10px] font-black uppercase tracking-wider text-slate-400">${u.title.split(':')[0]}</span>
                    <span class="text-[11px] font-black text-sky-600">${unitCompleted}/3 Subunidades</span>
                  </div>
                  <h3 class="font-extrabold text-xs text-slate-800 leading-tight">${u.title.split(':')[1] || u.title}</h3>
                </div>
              </div>

              <div class="space-y-2">
          `;

          u.subunits.forEach(sub => {
            const isDone = !!this.completedSubunits[sub.id];
            html += `
              <div onclick="app.startQuiz('${sub.id}')" class="p-3 rounded-2xl border-2 transition-all cursor-pointer flex items-center gap-3 ${isDone ? 'bg-emerald-50/70 border-emerald-300 hover:border-emerald-500' : 'bg-slate-50 border-slate-200 hover:border-sky-400 hover:bg-white'}">
                <div class="w-8 h-8 rounded-xl ${isDone ? 'bg-emerald-500 text-white' : 'bg-white border-2 border-slate-300 text-slate-600'} flex items-center justify-center text-xs font-black shrink-0 shadow-sm">
                  ${isDone ? '✓' : sub.code}
                </div>
                <div class="flex-1">
                  <div class="flex items-center justify-between">
                    <h4 class="font-black text-xs text-slate-800">${sub.title}</h4>
                    <span class="text-[10px] font-black px-2 py-0.5 rounded-full ${isDone ? 'bg-emerald-100 text-emerald-700' : 'bg-sky-100 text-sky-700'}">${isDone ? 'Completada ★' : 'Iniciar →'}</span>
                  </div>
                  <p class="text-[10px] font-bold text-slate-400 leading-snug mt-0.5">${sub.desc}</p>
                </div>
              </div>
            `;
          });

          html += `
              </div>
            </div>
          `;
        });

        html += `
            </div>
          </div>
        `;
        container.innerHTML = html;
      },

      startQuiz(subId) {
        this.currentSubunit = subId;
        const rawQuestions = QUESTION_BANK[subId] || [];

        // BARAJAR PREGUNTAS Y BARAJAR ALEATORIAMENTE LAS 4 OPCIONES
        this.quizQuestions = rawQuestions.map(q => {
          const mapped = q.options.map((text, idx) => ({
            text,
            isCorrect: idx === q.correct
          }));
          const shuffled = [...mapped].sort(() => Math.random() - 0.5);
          const newCorrect = shuffled.findIndex(item => item.isCorrect);
          return {
            q: q.q,
            options: shuffled.map(item => item.text),
            correct: newCorrect,
            exp: q.exp
          };
        }).sort(() => Math.random() - 0.5);

        this.qIndex = 0;
        this.selectedOption = null;
        this.isAnswered = false;
        this.tab = 'quiz';
        this.render();
      },

      renderQuiz(container) {
        const q = this.quizQuestions[this.qIndex];
        const progress = ((this.qIndex) / this.quizQuestions.length) * 100;

        let optionsHtml = '';
        q.options.forEach((opt, idx) => {
          let btnStyle = "bg-white border-2 border-slate-200 text-slate-700 hover:border-slate-300";
          if (this.selectedOption === idx) {
            btnStyle = "bg-sky-50 border-2 border-sky-500 text-sky-800 shadow-sm";
          }
          if (this.isAnswered) {
            if (idx === q.correct) {
              btnStyle = "bg-emerald-50 border-2 border-emerald-500 text-emerald-800 font-black";
            } else if (this.selectedOption === idx) {
              btnStyle = "bg-rose-50 border-2 border-rose-500 text-rose-800 line-through";
            } else {
              btnStyle = "bg-slate-50 border border-slate-200 text-slate-400 opacity-60";
            }
          }

          optionsHtml += `
            <button onclick="app.selectOption(${idx})" ${this.isAnswered ? 'disabled' : ''} class="w-full text-left p-3.5 rounded-2xl font-bold text-xs leading-relaxed transition-all btn-3d ${btnStyle} flex items-start gap-2.5">
              <span class="w-5 h-5 rounded-full border border-current flex items-center justify-center text-[10px] shrink-0 mt-0.5">${idx + 1}</span>
              <span class="flex-1">${opt}</span>
            </button>
          `;
        });

        let feedbackHtml = '';
        if (this.isAnswered) {
          const isCorrect = this.selectedOption === q.correct;
          feedbackHtml = `
            <div class="mt-3 p-3.5 rounded-2xl ${isCorrect ? 'bg-emerald-100 border border-emerald-300 text-emerald-900' : 'bg-rose-100 border border-rose-300 text-rose-900'}">
              <div class="flex items-center gap-2 font-black text-xs">
                <span>${isCorrect ? '✅ ¡Correcto!' : '❌ Incorrecto'}</span>
              </div>
              <p class="text-[11px] font-bold mt-1 text-slate-700 leading-snug">${q.exp}</p>
            </div>
          `;
        }

        container.innerHTML = `
          <div class="flex flex-col h-full justify-between pb-8">
            <div>
              <div class="flex items-center gap-3 mb-4">
                <button onclick="app.setTab('map')" class="text-slate-400 hover:text-slate-600 font-black text-lg">✕</button>
                <div class="flex-1 bg-slate-200 h-3 rounded-full overflow-hidden">
                  <div class="bg-emerald-500 h-full transition-all duration-300" style="width: ${progress}%"></div>
                </div>
                <span class="text-xs font-black text-slate-400">${this.qIndex + 1}/${this.quizQuestions.length}</span>
              </div>

              <div class="bg-sky-50 border border-sky-100 rounded-3xl p-4 mb-4">
                <span class="text-[10px] font-black uppercase text-sky-600 tracking-wider">Manual Teórico YCN</span>
                <h3 class="text-sm font-black text-slate-800 mt-1 leading-snug">${q.q}</h3>
              </div>

              <div class="space-y-2.5">
                ${optionsHtml}
              </div>

              ${feedbackHtml}
            </div>

            <div class="pt-4 mt-auto">
              ${!this.isAnswered ? `
                <button onclick="app.checkAnswer()" ${this.selectedOption === null ? 'disabled' : ''} class="w-full py-3.5 rounded-2xl font-black text-sm text-white bg-emerald-500 border-b-4 border-emerald-700 active:border-b-0 btn-3d disabled:opacity-40 disabled:pointer-events-none">
                  COMPROBAR
                </button>
              ` : `
                <button onclick="app.nextQuestion()" class="w-full py-3.5 rounded-2xl font-black text-sm text-white bg-sky-500 border-b-4 border-sky-700 active:border-b-0 btn-3d">
                  CONTINUAR →
                </button>
              `}
            </div>
          </div>
        `;
      },

      selectOption(idx) {
        if (this.isAnswered) return;
        this.selectedOption = idx;
        this.render();
      },

      checkAnswer() {
        if (this.selectedOption === null || this.isAnswered) return;
        this.isAnswered = true;
        const q = this.quizQuestions[this.qIndex];
        if (this.selectedOption === q.correct) {
          Sound.playSuccess();
          this.points += 15;
        } else {
          Sound.playError();
          this.lives = Math.max(0, this.lives - 1);
        }
        this.render();
      },

      nextQuestion() {
        if (this.qIndex + 1 < this.quizQuestions.length) {
          this.qIndex++;
          this.selectedOption = null;
          this.isAnswered = false;
          this.render();
        } else {
          if (this.currentSubunit) {
            this.completedSubunits[this.currentSubunit] = true;
            try {
              localStorage.setItem('timonel_completed', JSON.stringify(this.completedSubunits));
            } catch(e) {}
          }
          this.tab = 'map';
          this.render();
        }
      },

      selectFigure(idx) {
        if (this.figureIndex === idx) return;
        this.figureIndex = idx;
        this.exploredPart = null;
        this.tactileSuccess = null;
        this.tactileClicked = null;
        this.nextTactile();
        this.render();
      },

      setExploreMode(val) {
        this.exploreMode = val;
        this.exploredPart = null;
        this.tactileSuccess = null;
        this.tactileClicked = null;
        if (!val && !this.tactileTarget) {
          this.nextTactile();
        }
        this.render();
      },

      resetFigure(figId) {
        this.solvedParts[figId] = [];
        try {
          localStorage.setItem('timonel_solved_figures', JSON.stringify(this.solvedParts));
        } catch(e) {}
        this.nextTactile();
        this.render();
      },

      nextTactile() {
        const fig = RECOGNITION_FIGURES[this.figureIndex];
        if (!this.solvedParts[fig.id]) {
          this.solvedParts[fig.id] = [];
        }
        const solved = this.solvedParts[fig.id];
        const remaining = fig.parts.filter(p => !solved.includes(p.id));

        if (remaining.length > 0) {
          this.tactileTarget = remaining[Math.floor(Math.random() * remaining.length)];
        } else {
          this.tactileTarget = null;
        }
        this.tactileSuccess = null;
        this.tactileClicked = null;
      },

      handlePartClick(partId) {
        const fig = RECOGNITION_FIGURES[this.figureIndex];
        const part = fig.parts.find(p => p.id === partId);
        if (!part) return;

        if (this.exploreMode) {
          this.exploredPart = part;
          this.render();
          return;
        }

        // Modo Desafío
        if (this.tactileSuccess !== null || !this.tactileTarget) return;

        this.tactileClicked = part;
        if (partId === this.tactileTarget.id) {
          Sound.playSuccess();
          this.tactileSuccess = true;
          this.points += 20;
          if (!this.solvedParts[fig.id]) {
            this.solvedParts[fig.id] = [];
          }
          if (!this.solvedParts[fig.id].includes(partId)) {
            this.solvedParts[fig.id].push(partId);
            try {
              localStorage.setItem('timonel_solved_figures', JSON.stringify(this.solvedParts));
            } catch(e) {}
          }
        } else {
          Sound.playError();
          this.tactileSuccess = false;
          this.lives = Math.max(0, this.lives - 1);
        }
        this.render();
      },

      renderTactile(container) {
        const fig = RECOGNITION_FIGURES[this.figureIndex];
        if (!this.solvedParts[fig.id]) {
          this.solvedParts[fig.id] = [];
        }
        const solved = this.solvedParts[fig.id];
        const solvedCount = solved.length;
        const totalParts = fig.parts.length;
        const isComplete = solvedCount >= totalParts;

        // Fig Selector Tabs (4 Diagramas)
        let figTabsHtml = '';
        RECOGNITION_FIGURES.forEach((f, idx) => {
          const sCount = (this.solvedParts[f.id] || []).length;
          const isDone = sCount >= f.parts.length;
          const isActive = this.figureIndex === idx;
          figTabsHtml += `
            <button onclick="app.selectFigure(${idx})" class="p-2 rounded-2xl flex flex-col items-center justify-center transition-all ${
              isActive
                ? 'bg-sky-600 text-white shadow-md scale-[1.02]'
                : 'bg-white text-slate-700 border-2 border-slate-200 hover:border-sky-300'
            }">
              <span class="text-base">${f.icon}</span>
              <span class="text-[10px] font-black uppercase mt-0.5 tracking-tight">${f.num}</span>
              <span class="text-[9px] font-extrabold ${isActive ? 'text-sky-100' : 'text-slate-400'}">${sCount}/${f.parts.length} ${isDone ? '✓' : ''}</span>
            </button>
          `;
        });

        // Mode Switcher (Desafío vs Explorar)
        const modeSwitchHtml = `
          <div class="flex bg-slate-200/80 p-1 rounded-2xl mb-3 border border-slate-300">
            <button onclick="app.setExploreMode(false)" class="flex-1 py-1.5 rounded-xl text-xs font-black transition-all ${
              !this.exploreMode ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-800'
            }">
              🎯 Desafío (${solvedCount}/${totalParts})
            </button>
            <button onclick="app.setExploreMode(true)" class="flex-1 py-1.5 rounded-xl text-xs font-black transition-all ${
              this.exploreMode ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-800'
            }">
              🔍 Explorar y Repaso
            </button>
          </div>
        `;

        // Prompt header
        let promptHtml = '';
        if (this.exploreMode) {
          promptHtml = `
            <div class="bg-indigo-50 border-2 border-indigo-200 rounded-3xl p-3 text-center mb-3">
              <div class="flex items-center justify-center gap-1.5 text-[10px] font-black uppercase text-indigo-700 tracking-wider">
                <span>${fig.num}: ${fig.title}</span> • <span>Modo Exploración</span>
              </div>
              <p class="text-xs font-bold text-slate-700 mt-1 leading-snug">
                Toca cualquier etiqueta o pin en el gráfico para ver su definición náutica oficial.
              </p>
            </div>
          `;
        } else {
          if (isComplete) {
            promptHtml = `
              <div class="bg-emerald-50 border-2 border-emerald-300 rounded-3xl p-3 text-center mb-3">
                <div class="flex items-center justify-center gap-1.5 text-xs font-black text-emerald-800">
                  <span>🏆</span> ¡FIGURA COMPLETADA! (${totalParts}/${totalParts})
                </div>
                <p class="text-[11px] font-bold text-emerald-700 mt-0.5">Has identificado todas las partes de ${fig.title}.</p>
                <div class="flex gap-2 justify-center mt-2">
                  <button onclick="app.resetFigure('${fig.id}')" class="px-3 py-1 rounded-xl text-[10px] font-black bg-white border border-emerald-400 text-emerald-800 btn-3d">
                    🔄 Reiniciar Desafío
                  </button>
                  ${this.figureIndex < RECOGNITION_FIGURES.length - 1 ? `
                    <button onclick="app.selectFigure(${this.figureIndex + 1})" class="px-3 py-1 rounded-xl text-[10px] font-black bg-emerald-600 text-white btn-3d">
                      Siguiente Figura →
                    </button>
                  ` : ''}
                </div>
              </div>
            `;
          } else if (this.tactileTarget) {
            promptHtml = `
              <div class="bg-amber-50 border-2 border-amber-200 rounded-3xl p-3 text-center mb-3">
                <div class="flex items-center justify-center gap-2 text-[10px] font-black uppercase tracking-wider text-amber-700">
                  <span>Manual YCN • ${fig.num}</span>
                  <span class="text-amber-400">|</span>
                  <span class="bg-amber-100 px-2 py-0.5 rounded-full text-amber-800 font-extrabold">${solvedCount}/${totalParts} descubiertas</span>
                </div>
                <h3 class="text-xs font-extrabold text-slate-800 mt-1">
                  Toca con el dedo: <span class="text-sky-600 font-black text-sm uppercase underline underline-offset-2">${this.tactileTarget.name}</span>
                </h3>
              </div>
            `;
          }
        }

        // SVG Overlay Generation
        let svgElements = '';
        fig.parts.forEach(p => {
          const isSolved = solved.includes(p.id);
          const isExplored = this.exploreMode && this.exploredPart && this.exploredPart.id === p.id;

          // 1. Label Mask / Badge
          if (this.exploreMode) {
            svgElements += `
              <g onclick="app.handlePartClick('${p.id}')" class="interactive-zone">
                <rect x="${p.lx - 3}" y="${p.ly - 2}" width="${p.lw + 6}" height="${p.lh + 4}" rx="6" fill="${isExplored ? '#0284c7' : '#ffffff'}" stroke="${isExplored ? '#0369a1' : '#cbd5e1'}" stroke-width="${isExplored ? 2 : 1.5}" opacity="0.95" />
                <text x="${p.lx + p.lw/2}" y="${p.ly + p.lh/2 + 3.5}" fill="${isExplored ? '#ffffff' : '#0f172a'}" font-size="${p.lh > 24 ? 8.5 : 7.5}" font-weight="900" font-family="'Nunito', sans-serif" text-anchor="middle">${p.name}</text>
              </g>
            `;
          } else {
            if (isSolved) {
              svgElements += `
                <g onclick="app.handlePartClick('${p.id}')" class="interactive-zone">
                  <rect x="${p.lx - 3}" y="${p.ly - 2}" width="${p.lw + 6}" height="${p.lh + 4}" rx="6" fill="#059669" stroke="#ffffff" stroke-width="1.8" />
                  <text x="${p.lx + p.lw/2}" y="${p.ly + p.lh/2 + 3.5}" fill="#ffffff" font-size="${p.lh > 24 ? 8.5 : 7.5}" font-weight="900" font-family="'Nunito', sans-serif" text-anchor="middle">✓ ${p.name}</text>
                </g>
              `;
            } else {
              svgElements += `
                <g onclick="app.handlePartClick('${p.id}')" class="interactive-zone">
                  <rect x="${p.lx - 3}" y="${p.ly - 2}" width="${p.lw + 6}" height="${p.lh + 4}" rx="6" fill="#0284c7" stroke="#ffffff" stroke-width="1.8" />
                  <text x="${p.lx + p.lw/2}" y="${p.ly + p.lh/2 + 4}" fill="#ffffff" font-size="11" font-weight="900" font-family="'Nunito', sans-serif" text-anchor="middle">?</text>
                </g>
              `;
            }
          }

          // 2. Hotspots on the boat / part itself
          if (this.exploreMode) {
            svgElements += `
              <g onclick="app.handlePartClick('${p.id}')" class="interactive-zone">
                <circle cx="${p.tx}" cy="${p.ty}" r="${isExplored ? 11 : 7}" fill="${isExplored ? '#0284c7' : '#f59e0b'}" stroke="#ffffff" stroke-width="2" />
                ${isExplored ? `<circle cx="${p.tx}" cy="${p.ty}" r="17" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.6" />` : ''}
                <circle cx="${p.tx}" cy="${p.ty}" r="22" fill="transparent" />
              </g>
            `;
          } else {
            if (isSolved) {
              svgElements += `
                <g onclick="app.handlePartClick('${p.id}')" class="interactive-zone">
                  <circle cx="${p.tx}" cy="${p.ty}" r="9" fill="#10b981" stroke="#ffffff" stroke-width="2" />
                  <text x="${p.tx}" y="${p.ty + 3.5}" fill="#ffffff" font-size="9" font-weight="900" font-family="'Nunito', sans-serif" text-anchor="middle">✓</text>
                </g>
              `;
            } else {
              svgElements += `
                <g onclick="app.handlePartClick('${p.id}')" class="interactive-zone">
                  <circle cx="${p.tx}" cy="${p.ty}" r="14" fill="#38bdf8" fill-opacity="0.3" stroke="#0284c7" stroke-width="2" />
                  <circle cx="${p.tx}" cy="${p.ty}" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
                  <circle cx="${p.tx}" cy="${p.ty}" r="22" fill="transparent" />
                </g>
              `;
            }
          }
        });

        // Bottom Feedback Card
        let feedbackHtml = '';
        if (this.exploreMode) {
          if (this.exploredPart) {
            feedbackHtml = `
              <div class="mt-3 p-3.5 rounded-2xl bg-sky-50 border-2 border-sky-200 text-sky-950">
                <div class="flex items-center justify-between font-black text-xs">
                  <span class="text-sky-800 flex items-center gap-1">🧭 ${this.exploredPart.name}</span>
                  <span class="bg-sky-200 text-sky-800 px-2 py-0.5 rounded-full text-[10px] font-black">YCN / PNA</span>
                </div>
                <p class="text-[11px] font-bold text-slate-700 mt-1.5 leading-snug">${this.exploredPart.desc}</p>
                <div class="mt-2.5 pt-2 border-t border-sky-200 flex justify-end">
                  <button onclick="app.setExploreMode(false)" class="text-[10px] font-black bg-sky-600 text-white px-3 py-1 rounded-xl btn-3d">
                    Probar en Desafío 🎯
                  </button>
                </div>
              </div>
            `;
          } else {
            feedbackHtml = `
              <p class="text-center text-[11px] font-bold text-slate-400 mt-2">
                Toca cualquier etiqueta o pin en el gráfico para inspeccionar su función.
              </p>
            `;
          }
        } else {
          if (this.tactileSuccess === true && this.tactileClicked) {
            feedbackHtml = `
              <div class="mt-3 p-3.5 rounded-2xl bg-emerald-100 border-2 border-emerald-300 text-emerald-950">
                <div class="flex items-center justify-between font-black text-xs">
                  <span class="flex items-center gap-1.5">🎯 ¡Excelente! ${this.tactileClicked.name}</span>
                  <span class="bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded-full text-[10px] font-black">+20 XP</span>
                </div>
                <p class="text-[11px] font-bold text-slate-700 mt-1 leading-snug">${this.tactileClicked.desc}</p>
              </div>
            `;
          } else if (this.tactileSuccess === false) {
            feedbackHtml = `
              <div class="mt-3 p-3.5 rounded-2xl bg-rose-100 border-2 border-rose-300 text-rose-950">
                <div class="flex items-center justify-between font-black text-xs">
                  <span>❌ Zona incorrecta</span>
                  <span class="text-rose-600 text-[10px] font-extrabold">-1 ❤️</span>
                </div>
                <p class="text-[11px] font-bold text-slate-700 mt-1 leading-snug">
                  ${this.tactileClicked ? `Tocaste <b>${this.tactileClicked.name}</b>.` : ''}
                  <span class="text-rose-800">Pista para <b>${this.tactileTarget ? this.tactileTarget.name : ''}</b>: ${this.tactileTarget ? this.tactileTarget.desc : ''}</span>
                </p>
              </div>
            `;
          } else if (!isComplete && this.tactileTarget) {
            feedbackHtml = `
              <p class="text-center text-[11px] font-bold text-slate-400 mt-2">
                Toca el pin en el gráfico o el botón <b>[?]</b> correspondiente.
              </p>
            `;
          }
        }

        // Action button
        let actionBtnHtml = '';
        if (!this.exploreMode && this.tactileSuccess !== null) {
          actionBtnHtml = `
            <div class="pt-3 mt-auto">
              <button onclick="app.nextTactile(); app.render();" class="w-full py-3.5 rounded-2xl font-black text-sm text-white bg-sky-500 border-b-4 border-sky-700 active:border-b-0 btn-3d">
                SIGUIENTE PARTE →
              </button>
            </div>
          `;
        }

        container.innerHTML = `
          <div class="flex flex-col h-full justify-between pb-8">
            <div>
              <!-- 4 FIGURAS SELECTORAS -->
              <div class="grid grid-cols-4 gap-1.5 mb-3">
                ${figTabsHtml}
              </div>

              <!-- SELECTOR DE MODO -->
              ${modeSwitchHtml}

              <!-- PROMPT -->
              ${promptHtml}

              <!-- DIAGRAMA OFICIAL AUTÉNTICO CON CAPA SVG INTERACTIVA -->
              <div class="bg-white rounded-3xl p-1.5 border-2 border-slate-200 shadow-sm relative overflow-hidden select-none">
                <div class="relative w-full rounded-2xl overflow-hidden bg-slate-50 flex items-center justify-center">
                  <img src="${fig.image}" alt="${fig.title}" class="w-full h-auto block select-none pointer-events-none" />
                  <svg viewBox="0 0 ${fig.w} ${fig.h}" class="absolute inset-0 w-full h-full select-none cursor-pointer">
                    ${svgElements}
                  </svg>
                </div>
              </div>

              <!-- FEEDBACK -->
              ${feedbackHtml}
            </div>

            <!-- BOTÓN DE ACCIÓN -->
            ${actionBtnHtml}
          </div>
        `;
      },

      renderFlashcards(container) {
        const card = FLASHCARDS[this.cardIndex];
        container.innerHTML = `
          <div class="flex flex-col h-full justify-between pb-8">
            <div>
              <div class="flex items-center justify-between mb-3 text-slate-400 font-extrabold text-xs">
                <span>MANUAL OFICIAL YCN (TEMARIO COMPLETO)</span>
                <span>${this.cardIndex + 1} / ${FLASHCARDS.length}</span>
              </div>

              <div class="flashcard w-full h-72 cursor-pointer ${this.isFlipped ? 'flipped' : ''}" onclick="app.isFlipped = !app.isFlipped; app.render();">
                <div class="flashcard-inner relative w-full h-full rounded-3xl shadow-md border-2 border-slate-200">
                  
                  <div class="flashcard-front absolute w-full h-full bg-gradient-to-br from-white to-sky-50 rounded-3xl p-6 flex flex-col justify-between items-center text-center">
                    <span class="text-3xl">🧭</span>
                    <h3 class="text-lg font-black text-sky-800">${card.f}</h3>
                    <span class="text-[11px] font-extrabold text-sky-500 bg-sky-100 px-3 py-1 rounded-full">
                      Toca para girar 🔄
                    </span>
                  </div>

                  <div class="flashcard-back absolute w-full h-full bg-slate-800 rounded-3xl p-6 flex flex-col justify-between items-center text-center text-white">
                    <span class="text-xs font-black uppercase text-amber-400 tracking-wider">Definición Reglamentaria</span>
                    <p class="text-xs font-bold text-slate-200 leading-relaxed whitespace-pre-line">${card.b}</p>
                    <span class="text-[10px] font-bold text-slate-400">Escuela Náutica Yacht Club Neuquén</span>
                  </div>

                </div>
              </div>
            </div>

            <div class="flex gap-3 pt-4 mt-auto">
              <button onclick="app.prevCard()" class="flex-1 py-3 rounded-2xl font-black text-xs text-slate-700 bg-white border-2 border-slate-200 active:bg-slate-100 btn-3d">
                ← Anterior
              </button>
              <button onclick="app.nextCard()" class="flex-1 py-3 rounded-2xl font-black text-xs text-white bg-sky-500 border-b-4 border-sky-700 active:border-b-0 btn-3d">
                Siguiente →
              </button>
            </div>
          </div>
        `;
      },

      nextCard() {
        this.cardIndex = (this.cardIndex + 1) % FLASHCARDS.length;
        this.isFlipped = false;
        this.render();
      },

      prevCard() {
        this.cardIndex = (this.cardIndex - 1 + FLASHCARDS.length) % FLASHCARDS.length;
        this.isFlipped = false;
        this.render();
      },

      startExam() {
        let all = [];
        Object.values(QUESTION_BANK).forEach(arr => {
          arr.forEach(q => {
            const mapped = q.options.map((text, idx) => ({
              text,
              isCorrect: idx === q.correct
            }));
            const shuffled = [...mapped].sort(() => Math.random() - 0.5);
            const newCorrect = shuffled.findIndex(item => item.isCorrect);
            all.push({
              q: q.q,
              options: shuffled.map(item => item.text),
              correct: newCorrect,
              exp: q.exp
            });
          });
        });
        this.examQuestions = all.sort(() => Math.random() - 0.5).slice(0, 10);
        this.examIndex = 0;
        this.examScore = 0;
        this.selectedOption = null;
        this.isAnswered = false;
      },

      renderExam(container) {
        if (this.examIndex >= this.examQuestions.length) {
          const passed = this.examScore >= 7;
          container.innerHTML = `
            <div class="flex flex-col items-center justify-center h-full text-center p-4">
              <div class="text-6xl mb-3">${passed ? '🏅' : '⚓'}</div>
              <h2 class="text-2xl font-black text-slate-800">${passed ? '¡APROBADO!' : 'A REPASAR'}</h2>
              <p class="text-xs font-bold text-slate-500 mt-1">Simulacro Oficial Timonel YCN / PNA</p>
              
              <div class="bg-slate-50 border-2 border-slate-200 rounded-3xl p-6 w-full max-w-xs my-6">
                <span class="text-3xl font-black ${passed ? 'text-emerald-500' : 'text-rose-500'}">${this.examScore} / 10</span>
                <p class="text-[11px] font-extrabold text-slate-400 mt-1">${passed ? 'Cumpliste con el 70% reglamentario' : 'Necesitas al menos 7 respuestas correctas'}</p>
              </div>

              <button onclick="app.startExam(); app.render();" class="w-full max-w-xs py-3.5 rounded-2xl font-black text-sm text-white bg-sky-500 border-b-4 border-sky-700 active:border-b-0 btn-3d">
                VOLVER A RENDIR
              </button>
            </div>
          `;
          return;
        }

        const q = this.examQuestions[this.examIndex];
        let optionsHtml = '';
        q.options.forEach((opt, idx) => {
          let btnStyle = "bg-white border-2 border-slate-200 text-slate-700 hover:border-slate-300";
          if (this.selectedOption === idx) {
            btnStyle = "bg-sky-50 border-2 border-sky-500 text-sky-800 shadow-sm";
          }
          if (this.isAnswered) {
            if (idx === q.correct) btnStyle = "bg-emerald-50 border-2 border-emerald-500 text-emerald-800 font-black";
            else if (this.selectedOption === idx) btnStyle = "bg-rose-50 border-2 border-rose-500 text-rose-800 line-through";
            else btnStyle = "bg-slate-50 border border-slate-200 text-slate-400 opacity-60";
          }

          optionsHtml += `
            <button onclick="app.selectOption(${idx})" ${this.isAnswered ? 'disabled' : ''} class="w-full text-left p-3.5 rounded-2xl font-bold text-xs leading-relaxed btn-3d ${btnStyle} flex items-start gap-2.5">
              <span class="w-5 h-5 rounded-full border border-current flex items-center justify-center text-[10px] shrink-0 mt-0.5">${idx + 1}</span>
              <span class="flex-1">${opt}</span>
            </button>
          `;
        });

        container.innerHTML = `
          <div class="flex flex-col h-full justify-between pb-8">
            <div>
              <div class="flex items-center justify-between mb-3 text-slate-400 font-extrabold text-xs">
                <span>SIMULACRO EXAMEN OFICIAL</span>
                <span>${this.examIndex + 1} / 10</span>
              </div>

              <div class="bg-indigo-50 border border-indigo-100 rounded-3xl p-4 mb-4">
                <span class="text-[10px] font-black uppercase text-indigo-600 tracking-wider">Pregunta de Examen</span>
                <h3 class="text-sm font-black text-slate-800 mt-1 leading-snug">${q.q}</h3>
              </div>

              <div class="space-y-2.5">
                ${optionsHtml}
              </div>
            </div>

            <div class="pt-4 mt-auto">
              ${!this.isAnswered ? `
                <button onclick="app.checkExamAnswer()" ${this.selectedOption === null ? 'disabled' : ''} class="w-full py-3.5 rounded-2xl font-black text-sm text-white bg-indigo-600 border-b-4 border-indigo-800 active:border-b-0 btn-3d disabled:opacity-40 disabled:pointer-events-none">
                  CONFIRMAR RESPUESTA
                </button>
              ` : `
                <button onclick="app.nextExamQuestion()" class="w-full py-3.5 rounded-2xl font-black text-sm text-white bg-sky-500 border-b-4 border-sky-700 active:border-b-0 btn-3d">
                  SIGUIENTE →
                </button>
              `}
            </div>
          </div>
        `;
      },

      checkExamAnswer() {
        if (this.selectedOption === null || this.isAnswered) return;
        this.isAnswered = true;
        const q = this.examQuestions[this.examIndex];
        if (this.selectedOption === q.correct) {
          Sound.playSuccess();
          this.examScore++;
        } else {
          Sound.playError();
        }
        this.render();
      },

      nextExamQuestion() {
        this.examIndex++;
        this.selectedOption = null;
        this.isAnswered = false;
        this.render();
      }
    };

    window.onload = () => app.init();
  </script>
</body>
</html>
